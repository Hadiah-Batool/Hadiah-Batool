<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="280" rx="24" fill="#0D0D0D"/>
  <rect x="20" y="20" width="1160" height="240" rx="18" fill="#141414" stroke="#FF2E92" stroke-width="2"/>

  <!-- window top bar -->
  <rect x="20" y="20" width="1160" height="36" rx="18" fill="#1A1A1A"/>
  <circle cx="44" cy="38" r="6" fill="#FF2E92"/>
  <circle cx="64" cy="38" r="6" fill="#7A1F45"/>
  <circle cx="84" cy="38" r="6" fill="#3A3A3A"/>
  <text x="600" y="43" text-anchor="middle" font-family="Fira Code, monospace" font-size="12" fill="#888">hadiah.dev</text>

  <!-- code lines (left column) -->
  <g font-family="Fira Code, monospace" font-size="18">
    <text x="52" y="100" fill="#FF2E92">const</text>
    <text x="120" y="100" fill="#E6E6E6">hadiah</text>
    <text x="205" y="100" fill="#888">=</text>
    <text x="225" y="100" fill="#E6E6E6">{</text>

    <text x="70" y="132" fill="#FF7EB6">role</text>
    <text x="118" y="132" fill="#888">:</text>
    <text x="134" y="132" fill="#E6E6E6">"CS Student"</text>
    <text x="278" y="132" fill="#888">,</text>

    <text x="70" y="164" fill="#FF7EB6">focus</text>
    <text x="128" y="164" fill="#888">:</text>
    <text x="144" y="164" fill="#E6E6E6">"web + systems"</text>
    <text x="316" y="164" fill="#888">,</text>

    <text x="70" y="196" fill="#FF7EB6">believes</text>
    <text x="164" y="196" fill="#888">:</text>
    <text x="180" y="196" fill="#E6E6E6">true</text>
    <text x="228" y="196" fill="#888">,</text>

    <text x="52" y="228" fill="#E6E6E6">};</text>
  </g>

  <!-- blinking cursor -->
  <rect x="90" y="212" width="11" height="18" fill="#FF2E92">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- divider -->
  <line x1="560" y1="76" x2="560" y2="240" stroke="#2A2A2A" stroke-width="1.5"/>

  <!-- decorative pulse/heartbeat (right side) -->
  <path d="M620 156 h60 l18 -36 l26 72 l26 -108 l18 72 h190" stroke="#FF2E92" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- accent dots trailing the pulse -->
  <circle cx="1080" cy="156" r="4" fill="#FF7EB6"/>
  <circle cx="1100" cy="156" r="4" fill="#7A1F45"/>
  <circle cx="1120" cy="156" r="4" fill="#3A3A3A"/>
</svg>
