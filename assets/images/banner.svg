<svg width="360" height="360" viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg">
  <rect width="360" height="360" rx="24" fill="#0D0D0D"/>
  <rect x="20" y="20" width="320" height="320" rx="18" fill="#141414" stroke="#FF2E92" stroke-width="2"/>

  <!-- window top bar -->
  <rect x="20" y="20" width="320" height="36" rx="18" fill="#1A1A1A"/>
  <circle cx="42" cy="38" r="6" fill="#FF2E92"/>
  <circle cx="62" cy="38" r="6" fill="#7A1F45"/>
  <circle cx="82" cy="38" r="6" fill="#3A3A3A"/>
  <text x="180" y="43" text-anchor="middle" font-family="Fira Code, monospace" font-size="12" fill="#888">hadiah.dev</text>

  <!-- code lines -->
  <g font-family="Fira Code, monospace" font-size="14">
    <text x="44" y="95" fill="#FF2E92">const</text>
    <text x="96" y="95" fill="#E6E6E6">hadiah</text>
    <text x="160" y="95" fill="#888">=</text>
    <text x="176" y="95" fill="#E6E6E6">{</text>

    <text x="60" y="120" fill="#FF7EB6">role</text>
    <text x="98" y="120" fill="#888">:</text>
    <text x="110" y="120" fill="#E6E6E6">"CS Student"</text>
    <text x="215" y="120" fill="#888">,</text>

    <text x="60" y="145" fill="#FF7EB6">focus</text>
    <text x="106" y="145" fill="#888">:</text>
    <text x="118" y="145" fill="#E6E6E6">"web + systems"</text>
    <text x="255" y="145" fill="#888">,</text>

    <text x="60" y="170" fill="#FF7EB6">believes</text>
    <text x="134" y="170" fill="#888">:</text>
    <text x="146" y="170" fill="#E6E6E6">true</text>
    <text x="182" y="170" fill="#888">,</text>

    <text x="44" y="195" fill="#E6E6E6">};</text>
  </g>

  <!-- blinking cursor -->
  <rect x="44" y="212" width="10" height="16" fill="#FF2E92">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- decorative bottom heart/pulse -->
  <path d="M60 300 h30 l10 -20 l14 40 l14 -60 l10 40 h100" stroke="#FF2E92" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
